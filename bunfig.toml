# ============================================================================
# Formatter (bun fmt)
# ============================================================================
[fmt]
arrowParens = "always"
bracketSpacing = true
endOfLine = "lf"
printWidth = 100
semi = true
singleQuote = true
tabWidth = 2
trailingComma = "all"
ignorePatterns = [
  "node_modules",
  "bun.lock",
  "bun.lockb",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  "dist",
  "docs/api-reference",
  "coverage",
  "*.vsix",
]

# ============================================================================
# Linter (bun lint)
# ============================================================================
[lint]
ignorePatterns = ["dist/**", "docs/**", "node_modules/**", "coverage/**"]
plugins = [
  { name = "@stylistic", specifier = "@stylistic/eslint-plugin" },
  "jsdoc",
  "./rules/index.js",
]

[lint.rules]
# JSDoc Rules
"jsdoc/check-alignment" = "error"
"jsdoc/require-description" = [
  "error",
  { contexts = [
    "TSInterfaceDeclaration",
    "ExportNamedDeclaration > TSInterfaceDeclaration > TSInterfaceBody > :matches(TSPropertySignature, TSMethodSignature)",
    "ExportNamedDeclaration:has(VariableDeclaration)",
    "ExportNamedDeclaration:has(TSTypeAliasDeclaration)",
  ] },
]
"jsdoc/require-jsdoc" = [
  "error",
  { contexts = ["TSInterfaceDeclaration", "ExportNamedDeclaration > TSInterfaceDeclaration > TSInterfaceBody > :matches(TSPropertySignature, TSMethodSignature)", "ExportNamedDeclaration:has(VariableDeclaration)", "ExportNamedDeclaration:has(TSTypeAliasDeclaration)"], require = { ArrowFunctionExpression = false, ClassDeclaration = false, ClassExpression = false, FunctionDeclaration = false, FunctionExpression = false, MethodDefinition = false } },
]

# Custom Local AST Rules
"local/guard-patterns" = ["error", { maxLen = 100 }]
"local/prefer-includes" = "error"
"local/sort-function-declarations" = "error"

# Stylistic Rules
"@stylistic/comma-dangle" = ["error", "always-multiline"]
"@stylistic/padding-line-between-statements" = [
  "error",
  { blankLine = "always", next = "*", prev = ["const", "let"] },
  { blankLine = "any", next = ["const", "let"], prev = ["const", "let"] },
  { blankLine = "always", next = ["return", "continue", "break"], prev = "*" },
  { blankLine = "always", next = "block-like", prev = "*" },
  { blankLine = "always", next = "*", prev = "block-like" },
  { blankLine = "any", next = "*", prev = "singleline-block-like" },
  { blankLine = "any", next = "singleline-block-like", prev = "*" },
]
"@stylistic/quotes" = ["error", "single", { avoidEscape = true }]

# Code Metrics & Complexity Rules
complexity = ["error", 3]
"max-depth" = ["error", 4]
"max-lines" = ["error", { max = 300, skipBlankLines = true, skipComments = true }]
"max-lines-per-function" = ["error", 50]
"max-params" = ["error", 3]
"max-statements" = ["error", 10]

[[lint.overrides]]
files = ["src/**/*.ts", "src/**/*.tsx"]
rules = { "@typescript-eslint/no-unnecessary-condition" = "error", "@typescript-eslint/prefer-nullish-coalescing" = "error", "@typescript-eslint/prefer-optional-chain" = "error" }

[[lint.overrides]]
files = ["tests/**/*.ts", "**/*.test.ts", "**/*.spec.ts", "rules/**/*.js", "scripts/**/*.ts"]
rules = { complexity = "off", "max-lines" = "off", "max-lines-per-function" = "off", "max-statements" = "off" }

# ============================================================================
# Test Runner (bun test)
# ============================================================================
[test]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "tests/**",
  "test/**",
  "**/*.test.ts",
  "**/*.spec.ts",
  "rules/**",
  "scripts/**",
  "dist/**",
]

